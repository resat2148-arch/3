  <rect x="36" y="36" width="440" height="440" rx="84" fill="none" stroke="url(#edge)" stroke-width="10" filter="url(#glow)"/>
  <line x1="36" y1="256" x2="476" y2="256" stroke="#d7c3ff" stroke-opacity=".5" stroke-width="6"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#d7c3ff" stroke-opacity=".5" stroke-width="6"/>
  <g filter="url(#glow)">
    <circle cx="316" cy="170" r="40" fill="#141729" stroke="#fff1b0" stroke-width="10"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="210" cy="330" r="92" fill="url(#mallet)"/>
    <circle cx="210" cy="330" r="60" fill="#0a6b98"/>
    <circle cx="210" cy="330" r="38" fill="url(#knob)"/>
