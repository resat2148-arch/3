<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#18225e"/>
      <stop offset="1" stop-color="#05060f"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3d9a"/>
      <stop offset=".5" stop-color="#9b6bff"/>
      <stop offset="1" stop-color="#19e6ff"/>
    </linearGradient>
    <radialGradient id="mallet" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#c4faff"/>
      <stop offset=".45" stop-color="#19e6ff"/>
      <stop offset="1" stop-color="#064a74"/>
    </radialGradient>
    <radialGradient id="knob" cx="38%" cy="35%" r="70%">
